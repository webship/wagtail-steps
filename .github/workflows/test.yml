name: Test

on:
  push:
    branches:
      - 2.0.x
  pull_request:
    branches:
      - 2.0.x
  workflow_dispatch:

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cucumber:
    # The official Wagtail Bakery demo with its demo content, built in a DDEV project on the runner and run the way
    # the demo's production image runs it (uWSGI, DEBUG off, PostgreSQL), on two release lines:
    #   - wagtail-8.1: the current release, then the assertions that must fail (tests/must-fail);
    #   - wagtail-7.4: the long-term-support release (the demo at the commit that last ran on it), without the
    #     scenarios of the editor's autosave, which came with 8.0 (@autosave).
    name: wagtail-steps test suite (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: wagtail-8.1
            wagtail: '8.1'
            tags: 'not @wip and not @must-fail'
            must_fail: true
          - lane: wagtail-7.4
            wagtail: '7.4'
            tags: 'not @wip and not @must-fail and not @autosave'
            must_fail: false
    env:
      HEADLESS: 'true'
      FORCE_COLOR: '1'
      SITE_DIR: ${{ github.workspace }}/../wagtail-site
      WAGTAIL_VERSION: ${{ matrix.wagtail }}
      CUCUMBER_TAGS: ${{ matrix.tags }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Run cucumber-js dry-run (ambiguity / undefined step check)
        run: npx cucumber-js --dry-run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Build the test site (the demo, its content, the accounts)
        run: .github/scripts/build-ddev-site.sh

      - name: Check the site is the one cucumber.js runs against by default
        run: |
          DEFAULT_URL="$(LAUNCH_URL= node -e "console.log(require('./cucumber.js').default.worldParameters.launchUrl)")"
          echo "Built: $LAUNCH_URL, default: $DEFAULT_URL"
          test "${LAUNCH_URL%/}" = "$DEFAULT_URL"

      - name: Run the test suite
        run: npx cucumber-js

      - name: Run the test suite again (it leaves the site as it found it)
        run: npx cucumber-js

      - name: Run the assertions that must fail
        if: matrix.must_fail
        env:
          CUCUMBER_TAGS: ''
        run: npm run test:must-fail

      - name: Show the log of the site's server
        if: failure()
        run: |
          # The daemons of the web container (uWSGI among them) write to the container's log.
          cd "$SITE_DIR"
          ddev logs -s web --tail 500 < /dev/null || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.lane }}
          path: tests/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.lane }}
          path: |
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore
